<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5年2班 專屬班網</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; }
        .form-group { margin-bottom: 15px; }
        input { padding: 8px; width: 80%; margin-top: 5px; }
        button { padding: 8px 12px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; }
        button:hover { background: #1557b0; }
        .btn-board { background: #6c757d; font-size: 13px; }
        .btn-board.active { background: #1a73e8; }
        #cmd-bar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #333; padding: 10px; box-sizing: border-box; z-index: 9999; }
        #cmd-input { width: 90%; background: black; color: #0f0; border: 1px solid #555; padding: 10px; font-family: monospace; }
        .hidden { display: none; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; color: white; background: #888; }
        .post { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #1a73e8; position: relative; }
        .hw-card { background: #e8f0fe; padding: 12px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #34a853; }
        .post-time { font-size: 0.8em; color: #777; margin-left: 10px; }
        .board-tag { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-right: 5px; color: #333; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h1 style="margin: 0;">🏫 5年2班</h1>
        <button id="btn-toggle-cmd" style="padding: 6px 12px; font-size: 13px; background: #6c757d;">⚡ 指令</button>
    </div>
    
    <!-- 註冊與登入區塊 -->
    <div id="auth-section">
        <h3>註冊 / 登入</h3>
        <div class="form-group">
            <input type="number" id="seat-num" placeholder="座號 (老師請輸入 100)">
        </div>
        <div class="form-group">
            <input type="text" id="real-name" placeholder="真實姓名 (僅註冊需填)">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="密碼">
        </div>
        <div class="form-group">
            <input type="password" id="confirm-password" placeholder="確認密碼 (僅註冊需填)">
        </div>
        <button id="btn-register">註冊</button>
        <button id="btn-login">登入</button>
    </div>

    <!-- 登入後的主畫面 -->
    <div id="main-section" class="hidden">
        <div id="status-display" style="margin-bottom: 15px;">
            目前身分：<span class="status-badge" id="role-badge">一般學生</span>
            <button id="btn-logout" style="float: right; padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 3px;">登出</button>
        </div>
        
        <hr>
        <!-- 1. 發文區 -->
        <h3>💬 班級聊天室 / 發文區</h3>
        <textarea id="post-content" rows="3" style="width: 100%; box-sizing: border-box;" placeholder="說點什麼..."></textarea>
        <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                發佈至看板：
                <select id="select-post-board" style="padding: 5px; border-radius: 4px;">
                    <option value="gossip">💬 班務/閒聊</option>
                    <option value="homework">📖 課業討論</option>
                    <option value="game">🎮 遊戲/社團</option>
                    <option value="minecraft">麥塊</option>
                    <option value="roblox">Roblox</option>
                </select>
            </div>
            <button id="btn-submit-post">發佈貼文</button>
        </div>

        <hr>
        <!-- 2. 作業區 -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">📚 最新作業區</h3>
            <button id="upload-hw-btn" class="hidden" style="background: #28a745; font-size: 13px;">➕ 上傳新作業</button>
        </div>
        <div id="homework-area" style="margin-top: 10px;">
            <p style="color: #666; font-style: italic;">載入作業中...</p>
        </div>

        <hr>
        <!-- 3. 看板分類與留言對話紀錄 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="margin: 0;">💬 留言對話紀錄</h3>
        </div>

        <!-- PTT 看板分類切換按鈕 -->
        <div style="margin-bottom: 15px; background: #eee; padding: 8px; border-radius: 6px;">
            <strong style="font-size: 14px; margin-right: 5px;">📌 看板：</strong>
            <button class="btn-board active" data-board="all">全部</button>
            <button class="btn-board" data-board="gossip">💬 班務/閒聊</button>
            <button class="btn-board" data-board="homework">📖 課業討論</button>
            <button class="btn-board" data-board="game">🎮 遊戲/社團</button>
            <button class="btn-board" data-board="minecraft">麥塊</button>
            <button class="btn-board" data-board="roblox">Roblox</button>
        </div>

        <div id="posts-area">
            <!-- 聊天與發文會顯示在這裡 -->
        </div>
    </div>
</div>

<!-- 隱藏指令列 -->
<div id="cmd-bar">
    <input type="text" id="cmd-input" placeholder="指令例: /msg 5 哈囉, /ban 5 10, /chat 5, /admin, /teacher...">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔴 這裡請貼上你在 Firebase Console 複製的金鑰！
    const firebaseConfig = {
      apiKey: "AIzaSyD9JNb4xzvlAQUJir-TSvIml29VC6TLVTU",
      authDomain: "class-6fbf4.firebaseapp.com",
      projectId: "class-6fbf4",
      storageBucket: "class-6fbf4.firebasestorage.app",
      messagingSenderId: "863989862320",
      appId: "1:863989862320:web:87d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentRole = "student"; 
    let roleTimer = null;
    let bannedUsers = {}; 
    let activeBoard = "all"; // 當前選擇的看板

    const boardNames = {
        gossip: '💬 閒聊',
        homework: '📖 課業',
        game: '🎮 遊戲',
        minecraft:'麥塊',
        roblox: 'Roblox'
        
    };

    function formatEmail(seat) {
        return `student_seat_${seat}@class52.com`;
    }

    // 註冊功能
    document.getElementById('btn-register').addEventListener('click', async () => {
        const seat = document.getElementById('seat-num').value.trim();
        const name = document.getElementById('real-name').value.trim();
        const pwd = document.getElementById('password').value;
        const confirmPwd = document.getElementById('confirm-password').value;

        if (!seat || !name || !pwd) return alert("請填寫座號、真實姓名與密碼！");
        if (pwd !== confirmPwd) return alert("兩次輸入的密碼不一致！");

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, formatEmail(seat), pwd);
            await updateProfile(userCredential.user, { displayName: name });
            alert("註冊成功！已自動登入");
        } catch (error) {
            alert("註冊失敗：" + error.message);
        }
    });

    // 登入功能
    document.getElementById('btn-login').addEventListener('click', async () => {
        const seat = document.getElementById('seat-num').value.trim();
        const pwd = document.getElementById('password').value;

        if (!seat || !pwd) return alert("請輸入座號與密碼！");

        try {
            await signInWithEmailAndPassword(auth, formatEmail(seat), pwd);
            alert("登入成功！");
        } catch (error) {
            alert("登入失敗：座號或密碼錯誤！");
        }
    });

    // 登出功能
    document.getElementById('btn-logout').addEventListener('click', () => {
        signOut(auth);
    });

    // 監聽登入狀態
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');

            const seatMatch = currentUser.email ? currentUser.email.match(/student_seat_(\d+)@/) : null;
            if (seatMatch && seatMatch[1] === "100") {
                setTemporaryRole('teacher', '傳說中的光一老師', 1440);
            }

            loadPosts(); 
            loadHomeworks();
        } else {
            currentUser = null;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-section').classList.add('hidden');
        }
    });

    // 切換看板按鈕點擊事件
    document.querySelectorAll('.btn-board').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.btn-board').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            activeBoard = e.target.getAttribute('data-board');
            filterPostsBySeat('all');
        });
    });

    // 即時載入貼文
    function loadPosts() {
        filterPostsBySeat('all');
    }

    function filterPostsBySeat(seat) {
        const postsRef = collection(db, "posts");
        const q = query(postsRef, orderBy("timestamp", "desc"));

        const seatMatch = currentUser && currentUser.email ? currentUser.email.match(/student_seat_(\d+)@/) : null;
        const currentUserSeat = seatMatch ? String(seatMatch[1]) : null;

        onSnapshot(q, (snapshot) => {
            const postsArea = document.getElementById('posts-area');
            postsArea.innerHTML = ''; 
            
            let count = 0;
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                // 🔒 私訊過濾
                if (data.receiverSeat) {
                    const senderSeat = String(data.seatNumber);
                    const receiverSeat = String(data.receiverSeat);

                    const isSender = (currentUserSeat && senderSeat === currentUserSeat);
                    const isReceiver = (currentUserSeat && receiverSeat === currentUserSeat);
                    const isAdmin = (currentRole === 'admin');

                    if (!isSender && !isReceiver && !isAdmin) return;
                }

                // 📌 看板過濾
                if (activeBoard !== 'all' && data.board && data.board !== activeBoard) {
                    return;
                }

                // 特定座號過濾 (/chat 座號)
                if (seat !== 'all' && String(data.seatNumber) !== String(seat)) {
                    return;
                }

                count++;
                const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('zh-TW') : '剛剛';
                
                const postDiv = document.createElement('div');
                postDiv.className = 'post';

                // 刪除按鈕 (管理員或發文者本人)
                const isMyPost = (currentUserSeat && String(data.seatNumber) === currentUserSeat);
                const canDelete = (currentRole === 'admin' || isMyPost);
                
                const deleteBtnHtml = canDelete 
                    ? `<button class="btn-delete" data-id="${docId}" style="float: right; background: #dc3545; color: white; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 12px;">🗑️ 刪除</button>` 
                    : '';

                const tagHtml = data.board ? `<span class="board-tag">[${boardNames[data.board] || '一般'}]</span>` : '';

                if (data.receiverSeat) {
                    postDiv.style.background = '#fff3cd';
                    postDiv.style.borderLeft = '4px solid #ffc107';
                    postDiv.innerHTML = `
                        ${deleteBtnHtml}
                        <strong>${data.senderName}</strong> 🔒 <i>[私訊給 ${data.receiverSeat} 號]</i> <span class="post-time">${timeStr}</span><br>
                        <div style="margin-top: 5px; color: #856404;">${data.content}</div>
                    `;
                } else {
                    postDiv.innerHTML = `
                        ${deleteBtnHtml}
                        ${tagHtml}<strong>${data.senderName}</strong> <span class="post-time">${timeStr}</span><br>
                        <div style="margin-top: 5px;">${data.content}</div>
                    `;
                }

                postsArea.appendChild(postDiv);
            });

            // 綁定刪除功能
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const targetId = e.target.getAttribute('data-id');
                    if (confirm("確定要刪除這條貼文嗎？")) {
                        try {
                            await deleteDoc(doc(db, "posts", targetId));
                            alert("貼文已成功刪除！");
                        } catch (error) {
                            alert("刪除失敗：" + error.message);
                        }
                    }
                });
            });

            if (seat !== 'all') {
                alert(`已篩選座號 【${seat}】 的留言，共找到 ${count} 則記錄。（輸入 /chat all 可看全部）`);
            }
        });
    }

    // 載入作業
    function loadHomeworks() {
        const hwRef = collection(db, "homeworks");
        const q = query(hwRef, orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            const hwArea = document.getElementById('homework-area');
            hwArea.innerHTML = '';

            if (snapshot.empty) {
                hwArea.innerHTML = '<p style="color: #777;">目前沒有新作業！🎉</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleString('zh-TW') : '剛剛';

                const hwDiv = document.createElement('div');
                hwDiv.className = 'hw-card';
                hwDiv.innerHTML = `
                    <strong>📌 ${data.title}</strong> <span class="post-time">${timeStr}</span><br>
                    <div style="margin-top: 5px;">${data.content}</div>
                `;
                hwArea.appendChild(hwDiv);
            });
        });
    }

    // 老師發佈作業
    document.getElementById('upload-hw-btn').addEventListener('click', async () => {
        if (currentRole !== 'teacher' && currentRole !== 'admin') return alert("權限不足！");

        const title = prompt("請輸入作業科目/名稱：", "國語第十課單字");
        if (!title) return;

        const content = prompt("請輸入作業詳細說明或要求：");
        if (!content) return;

        try {
            await addDoc(collection(db, "homeworks"), {
                title: title,
                content: content,
                author: "光一老師",
                timestamp: serverTimestamp()
            });
            alert("作業發佈成功！");
        } catch (error) {
            alert("發佈失敗：" + error.message);
        }
    });

    // 發佈貼文
    document.getElementById('btn-submit-post').addEventListener('click', async () => {
        const content = document.getElementById('post-content').value.trim();
        const selectedBoard = document.getElementById('select-post-board').value;
        if (!content) return alert("內容不能為空！");

        const seatMatch = currentUser.email ? currentUser.email.match(/student_seat_(\d+)@/) : null;
        const userSeat = seatMatch ? seatMatch[1] : "";

        if (bannedUsers[userSeat] && Date.now() < bannedUsers[userSeat]) {
            const remainingMins = Math.ceil((bannedUsers[userSeat] - Date.now()) / 60000);
            return alert(`你已被管理員禁言！剩餘時間：${remainingMins} 分鐘。`);
        }

        let displayName = currentUser.displayName || "同學";
        if (currentRole === 'admin') displayName = "管理員";
        if (currentRole === 'teacher') displayName = "傳說中的光一老師";

        try {
            await addDoc(collection(db, "posts"), {
                senderName: displayName,
                seatNumber: userSeat,
                board: selectedBoard,
                content: content,
                timestamp: serverTimestamp()
            });
            document.getElementById('post-content').value = '';
        } catch (error) {
            alert("發佈失敗：" + error.message);
        }
    });

    // 私訊發送
    async function sendPrivateMessage(targetSeat, content) {
        const seatMatch = currentUser.email ? currentUser.email.match(/student_seat_(\d+)@/) : null;
        const userSeat = seatMatch ? seatMatch[1] : "";

        if (bannedUsers[userSeat] && Date.now() < bannedUsers[userSeat]) {
            const remainingMins = Math.ceil((bannedUsers[userSeat] - Date.now()) / 60000);
            return alert(`你已被管理員禁言！剩餘時間：${remainingMins} 分鐘。`);
        }

        let displayName = currentUser.displayName || "同學";
        if (currentRole === 'admin') displayName = "管理員";
        if (currentRole === 'teacher') displayName = "傳說中的光一老師";

        try {
            await addDoc(collection(db, "posts"), {
                senderName: displayName,
                seatNumber: userSeat,
                receiverSeat: String(targetSeat),
                content: content,
                timestamp: serverTimestamp()
            });
            alert(`已成功發送私訊給 【${targetSeat}】 號同學！`);
        } catch (error) {
            alert("私訊發送失敗：" + error.message);
        }
    }

    // 指令控制
    function toggleCmdBar() {
        const cmdBar = document.getElementById('cmd-bar');
        cmdBar.style.display = (cmdBar.style.display === 'block') ? 'none' : 'block';
        if (cmdBar.style.display === 'block') document.getElementById('cmd-input').focus();
    }

    document.getElementById('btn-toggle-cmd').addEventListener('click', toggleCmdBar);

    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.altKey && e.key.toLowerCase() === 'z') toggleCmdBar();
    });

    document.getElementById('cmd-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const cmd = e.target.value.trim();
            e.target.value = '';
            executeCommand(cmd);
        }
    });

    function executeCommand(cmd) {
        const parts = cmd.split(' ');
        const action = parts[0];

        if (action === '/admin') {
            const pwd = prompt("請輸入管理員密碼：");
            if (pwd === "admin123") setTemporaryRole('admin', '管理員', 10);
            else if (pwd !== null) alert("密碼錯誤！");
        } else if (action === '/teacher') {
            const pwd = prompt("請輸入光一老師認證密碼：");
            if (pwd === "teacher888") setTemporaryRole('teacher', '傳說中的光一老師', 10);
            else if (pwd !== null) alert("密碼錯誤！");
        } else if (action === '/msg') {
            const targetSeat = parts[1];
            const msgContent = parts.slice(2).join(' ').trim();
            if (!targetSeat || !msgContent) return alert("格式錯誤！/msg 座號 內容");
            sendPrivateMessage(targetSeat, msgContent);
        } else if (action === '/chat') {
            const targetSeat = parts[1];
            if (!targetSeat) alert("請輸入座號！/chat 座號 (或 /chat all)");
            else filterPostsBySeat(targetSeat);
        } else if (action === '/ban') {
            if (currentRole !== 'admin') return alert("權限不足！");
            const targetSeat = parts[1];
            const minutes = parseInt(parts[2]);
            if (!targetSeat || isNaN(minutes) || minutes <= 0) return alert("格式錯誤！/ban 座號 分鐘數");
            bannedUsers[targetSeat] = Date.now() + minutes * 60 * 1000;
            alert(`已成功禁言座號 【${targetSeat}】 號 ${minutes} 分鐘！`);
        } else {
            alert("未知指令");
        }
    }

    function setTemporaryRole(role, displayName, minutes) {
        currentRole = role;
        const badge = document.getElementById('role-badge');
        badge.innerText = displayName;
        badge.style.background = (role === 'admin') ? '#d93025' : '#188038';

        document.getElementById('upload-hw-btn').classList.toggle('hidden', role !== 'teacher' && role !== 'admin');
        alert(`已切換至【${displayName}】模式，時效 ${minutes} 分鐘。`);

        if (roleTimer) clearTimeout(roleTimer);
        roleTimer = setTimeout(() => {
            currentRole = 'student';
            badge.innerText = '一般學生';
            badge.style.background = '#888';
            document.getElementById('upload-hw-btn').classList.add('hidden');
            alert('權限已恢復為一般學生狀態。');
        }, minutes * 60 * 1000);
    }
</script>

</body>
</html>
